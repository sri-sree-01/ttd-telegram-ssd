name: telegram-ssd

on:
  # Triggered every 15 min by Supabase pg_cron (job: telegram-ssd-dispatch) via
  # the GitHub API — reliable, unlike GitHub's own throttled `schedule:` trigger.
  # Can still be run by hand from the Actions tab.
  workflow_dispatch: {}

concurrency:
  group: telegram-ssd
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # A normal run takes ~25 s. Without a limit a hung run holds the
    # concurrency group for GitHub's default 6 h and every later dispatch is
    # cancelled — on 23 Oct 2026 that blocked all reads from 1:45 PM to
    # 7:46 PM IST.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        timeout-minutes: 3
      - name: Run worker
        timeout-minutes: 3
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: LaxmiTeluguTechChannel
          TG_LIMIT: "20"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python worker.py
      # Sarva Darshan (free queue) — reads the "Tirumala Live Status" bot
      # (@TirumalaLiveBot) into public.sarva_darshan_raw. Runs even if the SSD
      # step failed, never fails the run, and skips itself when it already
      # ran in the last 10 min (this workflow is dispatched every 2-15 min).
      - name: Run Sarva Darshan worker
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          SARVA_BOT: TirumalaLiveBot
          SARVA_MIN_INTERVAL_MIN: "10"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sarva_worker.py
